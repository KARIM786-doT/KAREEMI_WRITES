<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Contact kareemi_writes with a question about learning resources."><title>Contact — kareemi_writes</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><script type="module" src="js/main.js"></script><link rel="icon" type="image/png" href="assets/images/kareemi-globe-icon.png?v=2"></head><body data-page="contact"><div data-site-header></div><main><section class="page-intro"><div class="wrap"><span class="eyebrow">WE’D LOVE TO HEAR FROM YOU</span><h1>Let’s <em>connect.</em></h1><p>Send us a note. Whether you have a question, suggestion, or just want to say hello, we’re listening.</p></div></section><section class="page-content wrap"><form class="form-card" data-contact-form><div class="form-field"><label for="contact-name">Full name</label><input class="form-control" id="contact-name" name="full_name" required maxlength="100" autocomplete="name"></div><div class="form-field"><label for="contact-email">Email address</label><input class="form-control" id="contact-email" name="email" type="email" required maxlength="254" autocomplete="email"></div><div class="form-field"><label for="contact-subject">Subject</label><input class="form-control" id="contact-subject" name="subject" required maxlength="160"></div><div class="form-field"><label for="contact-message">Message</label><textarea class="form-control" id="contact-message" name="message" required minlength="10" maxlength="4000"></textarea></div><div class="sr-only" aria-hidden="true"><label for="company-site">Leave this field empty</label><input id="company-site" name="website" tabindex="-1" autocomplete="off"></div><div class="form-message" role="status" aria-live="polite" data-form-message></div><button class="button button-green" type="submit">Send message <span>↗</span></button></form></section></main><div data-site-footer></div></body></html>
